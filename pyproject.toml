[project]
name = "leash"
version = "0.1.0"
description = "A local safety gateway for autonomous coding agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.120,<1",
  "httpx>=0.28,<1",
  "openai>=2,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.130,<7",
  "pyright>=1.1.400,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.26,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
leash = "leash.cli:app"

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "leash"
module-root = "src"

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.cache/pytest"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["docker: requires a running Docker Desktop Linux engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]

